name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:19.03.12
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Install Docker Compose
        run: curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose

      - name: Check Docker Compose version
        run: docker-compose --version

      - name: Copy .env.ci to .env
        run: cp src/core/.env.ci src/core/.env

      - name: Build and start containers
        run: |
          docker-compose -f docker-compose.yml up -d --build

      - name: Install dependencies and run commands
        run: |
          make migrations
          make migrate

      - name: Lint
        run: |
          make lint

      - name: Wait for ClickHouse to be ready
        run: sleep 10

      - name: Run tests
        run: make test

      - name: Shut down containers
        run: docker compose down -v
